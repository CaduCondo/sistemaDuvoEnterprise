name: Sync from Vercel (Auto)

# Trigger: Manual dispatch ou via webhook do Vercel
on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore: sync from Vercel'
  repository_dispatch:
    types: [vercel-deploy]
  schedule:
    # Executar automaticamente 1x por dia às 23:00 UTC (20:00 BRT)
    - cron: '0 23 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Check for changes from Vercel deployment
        id: check_changes
        run: |
          # Verificar se há mudanças reais para commitar
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ Nenhuma alteração detectada - repositório já está sincronizado"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "🔄 Alterações detectadas - preparando commit"
            git status --short
          fi

      - name: Commit and Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          COMMIT_MSG="${{ github.event.inputs.commit_message }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="chore: sync from Vercel - $(date '+%Y-%m-%d %H:%M:%S')"
          fi
          
          git commit -m "$COMMIT_MSG"
          git push origin main
          
          echo "✅ Sincronização concluída com sucesso!"
          echo "📦 Commit: $COMMIT_MSG"

      - name: No changes detected
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ Repositório já está atualizado - nenhuma ação necessária"