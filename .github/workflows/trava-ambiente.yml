name: Trava de ambiente

# Confere que a trava que impede um deploy de subir apontando para o banco de
# dados errado continua funcionando. Roda em todo push e pull request.
#
# Proposital: este workflow NAO depende de navegador, banco ou secrets. Ele e
# rapido (segundos) e independente da suite E2E, para que a protecao criada
# depois do incidente de 21/ago/2026 nunca fique sem verificacao.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  auto-teste:
    name: Auto-teste da trava de ambiente
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rodar o auto-teste da trava
        run: node scripts/check-supabase-env.js --self-test

      # Trava do reset de DEV (issue #36): o reset apaga o banco de destino,
      # entao a conferencia origem=PROD / destino=DEV tambem e testada em todo push.
      - name: Rodar o auto-teste da trava do reset de DEV
        run: node scripts/reset-dev/guard.js --self-test
