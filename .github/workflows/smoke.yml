name: Smoke Test

# Duas rodadas, uma atras da outra:
#
#   1. "smoke" — a rapida (poucos minutos). Roda SEMPRE, primeiro. E ela que
#      diz "pode seguir" ou "parou de pe". So os cenarios marcados @smoke:
#      os poucos caminhos que, se quebrarem, param o sistema.
#
#   2. "sistema_completo" — so comeca DEPOIS que a "smoke" passar (`needs:
#      smoke`). Roda todo o resto: todos os cenarios marcados
#      @sistemaCompleto, ou seja, TODAS as regras de negocio que a rodada 1
#      nao cobriu, sem repetir nenhum cenario da rodada 1. Mais lenta, mas
#      nao trava a rodada rapida nem a esperada por quem so quer saber "o
#      basico continua de pe?".
#
# Por que existe a divisao:
#   O workflow "E2E Tests" (suite antiga) rodava tudo junto a cada push,
#   levava ~60 minutos e falhava sempre. Um teste que falha sempre nao avisa
#   nada — vira ruido, e todo mundo aprende a ignorar. Dividir em duas
#   rodadas da o melhor dos dois mundos: resposta rapida e confiavel logo no
#   primeiro sinal, e cobertura completa das regras de negocio na sequencia.
#
# Ver e2e/SMOKE.md para a explicacao completa das duas tags.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Se chegar um push novo enquanto o anterior ainda esta rodando, cancela o
# anterior — nao adianta testar um commit que ja foi substituido, e evita
# fila de execucoes empilhadas.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      # Node 22, e nao 20: o Cucumber 13 (o programa que roda os cenarios
      # BDD) so funciona em Node 22, 24 ou 26+. Com Node 20 ele nem comeca:
      # "Cucumber can only run on Node.js versions 22 || 24 || >=26".
      # Foi assim que a primeira execucao deste workflow falhou — em 1m49s,
      # com a mensagem exata na tela. Antes, o mesmo erro ficava escondido
      # atras de 60 minutos de testes.
      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar o navegador de teste
        run: npx playwright install --with-deps chromium

      # Compila a aplicacao de verdade, como em producao. Os testes rodam
      # em cima deste build, e nao em modo de desenvolvimento — ver o
      # comentario em scripts/smoke.js.
      - name: Compilar a aplicacao
        run: npm run build

      # `npm run test:smoke` (scripts/smoke.js) sobe a aplicacao compilada,
      # espera ela responder, roda os cenarios marcados com @smoke em
      # paralelo e derruba a aplicacao no fim.
      - name: Rodar o smoke test (BDD)
        run: npm run test:smoke

      # Guarda sempre (passando ou falhando) -- ate 02/set/2026 so guardava
      # quando falhava, e ninguem conseguia ver o relatorio completo de um
      # push que passou (issue #68). Os arquivos HTML/JSON ja sao gerados
      # sempre pelo Cucumber (ver e2e/cucumber.smoke.config.cjs); so faltava
      # nao descartar no upload.
      - name: Guardar o relatorio
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: |
            e2e/reports/smoke-report.html
            e2e/reports/smoke-report.json
            e2e/reports/screenshots/
          retention-days: 14

  sistema_completo:
    name: Sistema completo (2a rodada)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar o navegador de teste
        run: npx playwright install --with-deps chromium

      - name: Compilar a aplicacao
        run: npm run build

      # `npm run test:completo` e o mesmo scripts/smoke.js do smoke, so que
      # aponta para e2e/cucumber.sistemaCompleto.config.cjs (--suite=
      # sistemaCompleto): sobe a aplicacao compilada, roda todos os
      # cenarios marcados com @sistemaCompleto e derruba a aplicacao no fim.
      - name: Rodar o sistema completo (BDD)
        run: npm run test:completo

      # Mesma logica do job "smoke" acima: guarda sempre, nao so quando falha
      # (issue #68).
      - name: Guardar o relatorio
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sistema-completo-report
          path: |
            e2e/reports/sistema-completo-report.html
            e2e/reports/sistema-completo-report.json
            e2e/reports/screenshots/
          retention-days: 14

  # Manda um e-mail com o resumo assim que a rodada completa termina --
  # passando ou falhando, e mesmo se o smoke falhar e o sistema_completo
  # nem chegar a rodar (por isso "needs" nos dois mas "if: always()").
  # Pedido do Cadu em 02/set/2026, issue #69.
  notificar_por_email:
    name: Enviar relatorio por e-mail
    needs: [smoke, sistema_completo]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      # continue-on-error: os artefatos so existem se o job correspondente
      # rodou (ver "if: always()" acima -- sistema_completo pode nao ter
      # rodado se o smoke falhou).
      - name: Baixar o relatorio do smoke
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-report
          path: relatorios/smoke

      - name: Baixar o relatorio do sistema completo
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sistema-completo-report
          path: relatorios/completo

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Montar o resumo e enviar o e-mail
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESULTADO_SMOKE: ${{ needs.smoke.result }}
          RESULTADO_COMPLETO: ${{ needs.sistema_completo.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/enviar-relatorio-email.js
